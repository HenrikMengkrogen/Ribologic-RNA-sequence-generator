name: TROUBLESHOOT

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin

          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin

          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - name: Windows x86_64 (MinGW)
            os: windows-latest
            target: x86_64-pc-windows-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      

      # setup.sh requires the native MSYS2 MINGW64 environment on Windows.
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: minimal
          cache: true
          suppress-deprecation-warnings: msystem-mingw64

          # Avoid collisions with the default runner-temp msys64 location.
          location: ${{ runner.temp }}\msys64-ribologic

      # On macOS
      - name: Run setup, test, build and run
        if: runner.os == 'MacOS'
        shell: bash
        run: |
          chmod +x ./setup.sh
          source ./setup.sh
          source .venv/bin/activate
          cargo test --locked --target "${{ matrix.target }}"
          cargo build -vv  --locked --target "${{ matrix.target }}"
          cargo run --locked --target "${{ matrix.target }}"

        if: runner.os == 'MacOS'
        env:
          RUST_BACKTRACE: 1
        run: cargo run --locked --target "${{ matrix.target }}"

      # On Linux
      - name: Run setup, Install valgrind, run test and build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./setup.sh
          source ./setup.sh
          sudo apt-get update && sudo apt-get install -y valgrind
          source .venv/bin/activate
          cargo test --locked --target "${{ matrix.target }}"
          cargo build -vv  --locked --target "${{ matrix.target }}"
              printf '1\n1\n' | valgrind --error-exitcode=1 --track-origins=yes \
            target/"${{ matrix.target }}"/debug/Ribologic-RNA-sequence-generator
            cargo run --locked --target "${{ matrix.target }}"

        if: runner.os == 'Linux'
        env:
          RUST_BACKTRACE: 1
        run: cargo run --locked --target "${{ matrix.target }}"

      

      # On Windows
      - name: Setup, test, and build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          chmod +x ./setup.sh
          source ./setup.sh
          source .venv/bin/activate
          cargo test --locked --target "${{ matrix.target }}"
          cargo build -vv --locked --target "${{ matrix.target }}"
          cargo run --locked --target "${{ matrix.target }}"

        if: runner.os == 'Windows'
        env:
          RUST_BACKTRACE: 1
        run: cargo run --locked --target "${{ matrix.target }}"
