name: Test all platforms

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin

          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin

          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # GitHub-hosted ARM64 runner availability depends on repository
          # visibility and GitHub plan.
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # setup.sh installs all dependencies, including Rust target support,
      # LLVM/libclang, ViennaRNA, and native libraries.
      - name: Setup, test, and build
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./setup.sh
          source ./setup.sh

          cargo test --locked --target "${{ matrix.target }}"
          cargo build --locked --target "${{ matrix.target }}"

  windows-gnu:
    name: Windows x86_64 GNU
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This installs MSYS2 itself. setup.sh installs all actual project
      # dependencies with pacman and builds/stages ViennaRNA.
      - name: Set up MSYS2 shell
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: minimal
          cache: true
          location: ${{ runner.temp }}\ribosome-msys64
          suppress-deprecation-warnings: msystem-mingw64

      # Do not source this script here. setup.sh writes Cargo's directory to
      # GITHUB_PATH, which GitHub applies to subsequent workflow steps.
      - name: Set up Windows dependencies
        run: |
          set -euo pipefail

          chmod +x ./setup.sh
          ./setup.sh

      # This verifies that setup.sh successfully persisted Cargo's directory
      # through GITHUB_PATH.
      - name: Verify Rust and toolchain
        run: |
          set -euo pipefail

          echo "PATH=$PATH"

          command -v cargo
          command -v rustc
          command -v gcc
          command -v clang

          cargo --version
          rustc --version

      - name: Run Windows GNU tests
        run: |
          set -euo pipefail

          cargo test --locked --target x86_64-pc-windows-gnu

      - name: Build Windows GNU binary
        run: |
          set -euo pipefail

          cargo build --locked --target x86_64-pc-windows-gnu
