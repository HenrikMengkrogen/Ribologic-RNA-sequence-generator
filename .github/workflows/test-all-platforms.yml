name: Test all platforms

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Intel macOS runner
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin

          # Native Apple Silicon macOS runner
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin

          # Native Intel/AMD Linux runner
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Native ARM64 Linux runner
          #
          # Availability depends on repository visibility and GitHub plan.
          # If this label is unavailable for your repository, use a
          # self-hosted ARM64 Linux runner instead.
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          # Native Windows x86_64, using the GNU/MinGW Rust target.
          - name: Windows x86_64 GNU
            os: windows-latest
            target: x86_64-pc-windows-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This installs MSYS2 itself so setup.sh can run in its required
      # MINGW64 shell. Project dependencies must be installed by setup.sh.
      - name: Set up MSYS2 shell
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: minimal
          cache: true

          # Avoid the action's default MSYS2 path, which can collide with
          # an existing directory on GitHub-hosted Windows runners.
          location: ${{ runner.temp }}\ribosome-msys64

          suppress-deprecation-warnings: msystem-mingw64

      # setup.sh is responsible for installing all project dependencies:
      #
      # - Rust/rustup and the appropriate Rust target
      # - compiler and build tools
      # - libclang / LLVM for bindgen
      # - ViennaRNA and its native dependencies
      # - staging native libraries for build.rs
      #
      # Source the script so environment exports such as PATH, CARGO_HOME,
      # LIBCLANG_PATH, PKG_CONFIG_PATH, etc. remain available afterward.
      - name: Setup, test, and build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./setup.sh
          source ./setup.sh

          cargo test --locked --target "${{ matrix.target }}"
          cargo build --locked --target "${{ matrix.target }}"

      - name: Setup, test, and build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail

          chmod +x ./setup.sh
          source ./setup.sh

          cargo test --locked --target "${{ matrix.target }}"
          cargo build --locked --target "${{ matrix.target }}"
