name: Test all platforms

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin

          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin

          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Availability depends on the repository's GitHub plan/visibility.
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup, test, and build
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./setup.sh
          source ./setup.sh

          command -v cargo
          cargo --version

          cargo test --locked --target "${{ matrix.target }}"
          cargo build --locked --target "${{ matrix.target }}"

  windows-gnu:
    name: Windows x86_64 GNU
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This supplies the MSYS2 MINGW64 environment.
      # setup.sh installs project dependencies with pacman.
      - name: Set up MSYS2 shell
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: minimal
          cache: true
          location: ${{ runner.temp }}\ribosome-msys64
          suppress-deprecation-warnings: msystem-mingw64

      # setup.sh and Cargo must run in the SAME shell process.
      - name: Setup, test, and build Windows GNU
        run: |
            set -euo pipefail

            chmod +x ./setup.sh

            # Must be `source`, not `./setup.sh`.
            source ./setup.sh

            echo "Cargo after setup:"
            command -v cargo
            cargo --version
            rustc --version

            cargo test --locked --target x86_64-pc-windows-gnu
            cargo build --locked --target x86_64-pc-windows-gnu
