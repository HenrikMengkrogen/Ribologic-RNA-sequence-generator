name: Test setup

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin

          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin

          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - name: Windows x86_64 (MinGW)
            os: windows-latest
            target: x86_64-pc-windows-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Needed only because setup.sh requires an MSYS2 MINGW64 environment
      # on native Windows.
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: minimal
          cache: true
          suppress-deprecation-warnings: msystem-mingw64

      # macOS and Linux
      - name: Run setup
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./setup.sh
          ./setup.sh

      - name: Run tests
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test --locked --target "${{ matrix.target }}"

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: cargo build --locked --target "${{ matrix.target }}"

      # Windows — must run inside the MSYS2 MINGW64 shell.
      - name: Run setup
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          chmod +x ./setup.sh
          ./setup.sh

      - name: Run tests
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cargo test --locked --target "${{ matrix.target }}"

      - name: Build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cargo build --locked --target "${{ matrix.target }}"
